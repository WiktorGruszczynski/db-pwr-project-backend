server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Odpowiednik proxy Vite z dev: ruch /api/* leci do backendu,
    # a prefiks /api jest zdejmowany (trailing slash w proxy_pass).
    # Dzięki temu front (api.js) działa bez zmian, a cookie sesji jest
    # same-origin (przeglądarka widzi tylko origin nginx-a).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trasy SPA (/recipes, /products, /meals, ...) — odświeżenie dowolnej
    # podstrony serwuje index.html zamiast zwracać 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
